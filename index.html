<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis | Advanced Digital Protection</title>
    
    <!-- Core Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11.0.8/dist/framer-motion.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { black: '#030508', accent: '#00F0FF', neon: '#7B2CBF', emerald: '#00FF9D' }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-black text-white font-space antialiased">
    <div id="root">
        <div id="fallback-loader" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #030508; color: #00F0FF; font-family: sans-serif;">
            <div style="width: 30px; height: 30px; border: 2px solid #00F0FF; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p style="margin-top: 20px; font-size: 10px; letter-spacing: 0.1em;">ESTABLISHING_AEGIS_LINK...</p>
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <!-- Dependency Check -->
    <script>
        window.onload = function() {
            const deps = {
                'React': !!window.React,
                'ReactDOM': !!window.ReactDOM,
                'Babel': !!window.Babel,
                'Three': !!window.THREE,
                'Motion': !!(window.Motion || window.framerMotion)
            };
            console.log('Aegis Dependencies:', deps);
            if (Object.values(deps).some(v => !v)) {
                document.getElementById('fallback-loader').innerHTML = 
                    '<p style="color: #ff4444;">CRITICAL_ERROR: LIBRARIES_NOT_LOADED. Check connection.</p>';
            }
        };
    </script>

    <!-- Application Script -->
    <script type="text/babel" src="app.jsx?v=4"></script>
</body>
</html>
