<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis | Advanced Digital Protection</title>
    
    <!-- Core Libraries (Cloudflare CDNs for maximum reliability) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.11/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/10.16.4/framer-motion.umd.min.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { black: '#030508', accent: '#00F0FF', neon: '#7B2CBF', emerald: '#00FF9D' }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-black text-white font-space antialiased">
    <div id="root">
        <div id="fallback-loader" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #030508; color: #00F0FF; font-family: sans-serif;">
            <div style="width: 30px; height: 30px; border: 2px solid #00F0FF; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p style="margin-top: 20px; font-size: 10px; letter-spacing: 0.2em; font-family: 'Orbitron', sans-serif;">AEGIS_LINKING...</p>
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        </div>
    </div>

    <!-- Dependency Check -->
    <script>
        window.onload = function() {
            const deps = {
                'React': !!window.React,
                'ReactDOM': !!window.ReactDOM,
                'Babel': !!window.Babel,
                'Three': !!window.THREE,
                'Motion': !!(window.Motion || window.framerMotion)
            };
            console.log('Aegis Status:', deps);
            
            const failed = Object.keys(deps).filter(k => !deps[k]);
            if (failed.length > 0) {
                document.getElementById('fallback-loader').innerHTML = `
                    <div style="text-align: center; max-width: 400px; padding: 20px; border: 1px solid #ff4444; background: rgba(255,68,68,0.1);">
                        <p style="color: #ff4444; font-weight: bold; margin-bottom: 10px;">CORE_SYSTEM_FAILURE</p>
                        <p style="color: #888; font-size: 12px; line-height: 1.5;">
                            The following modules failed to establish a secure link: <br/>
                            <span style="color: #fff;">${failed.join(', ')}</span>
                        </p>
                        <p style="color: #555; font-size: 10px; margin-top: 20px;">CHECK INTERNET CONNECTION // BYPASS FIREWALL</p>
                    </div>
                `;
            }
        };
    </script>

    <!-- Application Script -->
    <script type="text/babel" src="app.jsx?v=6"></script>
</body>
</html>
